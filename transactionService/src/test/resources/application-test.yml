# Tests run against an in-memory H2 database so the suite needs no running Postgres.
# The H2 port of the schema lives in db/h2migration; dev/prod stay on Postgres (db/migration).
spring:
  datasource:
    url: jdbc:h2:mem:transactionsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/h2migration

app:
  security:
    issuer: userService
    audience: awbd-banking-api
    # Never contacted: the tests supply their own decoder backed by a throwaway key pair.
    jwk-set-uri: http://localhost:8081/api/auth/jwks.json

  clients:
    # Overridden per test; the propagation test points it at a stub server.
    banking-service-url: http://localhost:9
