spring:
  application:
    name: transactionService
  profiles:
    active: dev

server:
  port: 8083

logging:
  level:
    root: INFO
    transactionService.demo: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    circuitbreakers:
      enabled: true

app:
  pagination:
    default-size: 20
    max-size: 100
  security:
    # Must match what userService puts in the iss/aud claims, or every token is rejected.
    issuer: ${JWT_ISSUER:userService}
    audience: ${JWT_AUDIENCE:awbd-banking-api}
    # Public verification keys only; the private signing key never leaves userService.
    jwk-set-uri: ${JWT_JWKS_URI:http://localhost:8081/api/auth/jwks.json}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

  clients:
    banking-service-url: ${BANKING_SERVICE_URL:http://localhost:8082}

resilience4j:
  retry:
    instances:
      bankingService:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        # A 4xx from bankingService is a business decision, not a transient failure - never retried.
        ignore-exceptions:
          - transactionService.demo.domain.exception.BankingBusinessException
  circuitbreaker:
    instances:
      bankingService:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        ignore-exceptions:
          - transactionService.demo.domain.exception.BankingBusinessException
