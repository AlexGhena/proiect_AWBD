# Tests run against an in-memory H2 database so the suite needs no running Postgres.
# The H2 port of the schema lives in db/h2migration; dev/prod stay on Postgres (db/migration).
# Everything lives in H2's default PUBLIC schema, which also lets the unqualified remember-me
# SQL and the JdbcUserDetailsManager queries (app.security.jdbc.schema) resolve.
spring:
  datasource:
    url: jdbc:h2:mem:userdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/h2migration

app:
  security:
    jdbc:
      schema: PUBLIC
    jwt:
      issuer: userService
      audience: awbd-banking-api
      access-token-ttl: 15m
    remember-me:
      key: test-only-remember-me-key
