spring:
  datasource:
    # currentSchema puts the project schema on the connection search path so Spring Security's
    # remember-me repository, whose SQL is unqualified, resolves persistent_logins correctly.
    url: jdbc:postgresql://localhost:5432/awbd?currentSchema=users
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: users
        format_sql: true
  flyway:
    enabled: true
    schemas: users
    default-schema: users
    baseline-on-migrate: true
